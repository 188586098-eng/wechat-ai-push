name: AI 资讯日报定时推送

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-news-daily
  cancel-in-progress: false

jobs:
  push-daily-news:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 缓存去重记录
        uses: actions/cache@v4
        with:
          path: gh-actions/data
          key: ai-news-sent-${{ runner.os }}
          restore-keys: |
            ai-news-sent-${{ runner.os }}

      - name: 运行推送脚本
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          USER_LLM_API_KEY: ${{ secrets.USER_LLM_API_KEY }}
          USER_LLM_BASE_URL: ${{ secrets.USER_LLM_BASE_URL }}
          USER_LLM_MODEL: ${{ secrets.USER_LLM_MODEL }}
          WEWE_TOKEN: ${{ secrets.WEWE_TOKEN }}
          WEWE_XID: ${{ secrets.WEWE_XID }}
          PLATFORM_URL: ${{ secrets.PLATFORM_URL }}
        run: node gh-actions/index.js

      - name: 上传日报制品
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-news-daily-report
          path: gh-actions/output/
          retention-days: 30
