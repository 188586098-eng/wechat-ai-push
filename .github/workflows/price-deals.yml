name: 历史低位好价定时推送

on:
  schedule:
    # 北京 09:00 与 21:00（GitHub Actions 时区为 UTC）
    - cron: '0 1 * * *'
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: price-deals
  cancel-in-progress: false

jobs:
  push-deals:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 运行好价推送
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          DEAL_KEYWORDS: ${{ vars.DEAL_KEYWORDS }}
        run: node src/price/index.js --deals
